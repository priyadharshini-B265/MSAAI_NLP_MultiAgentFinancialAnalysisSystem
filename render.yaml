services:
  - type: web
    name: multiagent-financial-orchestrator
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python run_web.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PORT
        value: 10000
      - key: HOST
        value: 0.0.0.0
